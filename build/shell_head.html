<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java 高级 / 架构师 面试复习知识库</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1f2328; --muted:#606a76; --border:#e3e6ea;
  --accent:#2563eb; --accent-soft:#eef4ff; --code-bg:#f4f6f8; --shadow:0 1px 3px rgba(16,24,40,.08);
  --mark:#fff2a8; --sidebar-w:326px;
}
html[data-theme="dark"]{
  --bg:#14171c; --panel:#1b1f26; --text:#e6e9ee; --muted:#98a2b3; --border:#2b313a;
  --accent:#6ea8fe; --accent-soft:#1e2a3d; --code-bg:#12161b; --shadow:0 1px 3px rgba(0,0,0,.4);
  --mark:#5c4d00;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.78 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- 布局 ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w); background:var(--panel);
  border-right:1px solid var(--border); position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column; z-index:20;
}
.brand{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.brand h1{margin:0;font-size:16px;line-height:1.4}
.brand .stat{margin-top:6px;font-size:12px;color:var(--muted)}
.searchbox{padding:12px 14px;border-bottom:1px solid var(--border)}
.searchbox input{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);font-size:13.5px;outline:none;
}
.searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox .hint{margin-top:6px;font-size:11.5px;color:var(--muted)}
.nav{overflow-y:auto;padding:8px 8px 40px;flex:1}
.nav .group{margin:10px 6px 4px;font-size:11.5px;font-weight:700;letter-spacing:.04em;
  color:var(--muted)}
.nav a.item{
  display:block;padding:7px 10px;margin:1px 0;border-radius:7px;color:var(--text);
  font-size:13.5px;line-height:1.5;
}
.nav a.item:hover{background:var(--bg);text-decoration:none}
.nav a.item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a.item .stars{display:block;font-size:11px;color:var(--muted);letter-spacing:.5px;margin-top:1px}
.nav a.item.hidden{display:none}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:15;background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:9px 20px;min-height:48px;
}
.topbar .crumb{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.btn{
  border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:7px;
  padding:5px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
#menuBtn{display:none}
#progress{position:fixed;top:0;left:0;height:2px;background:var(--accent);width:0;z-index:50;transition:width .1s}

.content{padding:26px 40px 120px;max-width:1080px;width:100%;margin:0 auto}
.chapter{display:none}
.chapter.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ---------- 正文排版 ---------- */
.chapter h1{font-size:27px;line-height:1.35;margin:.2em 0 .5em;padding-bottom:.35em;border-bottom:2px solid var(--border)}
.chapter h2{font-size:21px;margin:1.9em 0 .7em;padding-left:10px;border-left:4px solid var(--accent);line-height:1.4}
.chapter h3{font-size:17px;margin:1.5em 0 .5em}
.chapter h4{font-size:15px;margin:1.2em 0 .4em;color:var(--muted)}
.chapter p{margin:.7em 0}
.chapter ul,.chapter ol{padding-left:1.5em;margin:.6em 0}
.chapter li{margin:.28em 0}
.chapter blockquote{
  margin:1em 0;padding:10px 16px;background:var(--accent-soft);border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;color:var(--text);
}
.chapter blockquote p{margin:.2em 0}
.chapter hr{border:none;border-top:1px solid var(--border);margin:2em 0}
.chapter code{background:var(--code-bg);padding:.14em .38em;border-radius:5px;
  font-family:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:.88em}
.code-block{position:relative;margin:1em 0}
.code-block .code-lang{
  position:absolute;top:0;right:0;background:var(--border);color:var(--muted);
  font-size:11px;padding:2px 8px;border-radius:0 8px 0 6px;font-family:monospace;
}
.code-block pre{
  margin:0;background:var(--code-bg);border:1px solid var(--border);border-radius:8px;
  padding:26px 14px 12px;overflow:auto;max-height:640px;
}
.code-block pre code{background:none;padding:0;font-size:13px;line-height:1.65}
.table-wrap{overflow-x:auto;margin:1em 0}
.chapter table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--panel)}
.chapter th,.chapter td{border:1px solid var(--border);padding:7px 11px;text-align:left;vertical-align:top}
.chapter th{background:var(--accent-soft);font-weight:600;white-space:nowrap}
.chapter tbody tr:nth-child(even){background:color-mix(in srgb,var(--bg) 55%,transparent)}

/* ---------- Mermaid ---------- */
.diagram{
  margin:1.1em 0;padding:14px;background:var(--panel);border:1px solid var(--border);
  border-radius:10px;overflow-x:auto;cursor:zoom-in;
}
.diagram pre.mermaid{margin:0;background:none;border:none;text-align:center;min-height:20px}
.diagram svg{max-width:100%;height:auto}
.diagram-error{border-color:#e5484d;color:#e5484d;font-size:12.5px;white-space:pre-wrap;cursor:default}
.zoom{
  position:fixed;inset:0;background:rgba(10,12,16,.86);z-index:100;display:none;
  align-items:center;justify-content:center;padding:28px;cursor:zoom-out;
}
.zoom.on{display:flex}
.zoom .inner{background:var(--panel);border-radius:12px;padding:22px;max-width:96vw;max-height:92vh;overflow:auto}
.zoom svg{max-width:none;width:auto;min-width:60vw}

/* ---------- 本页大纲 / 章节导航 ---------- */
.page-toc{
  margin:0 0 1.4em;padding:10px 16px;background:var(--panel);border:1px solid var(--border);
  border-radius:10px;font-size:13.5px;
}
.page-toc summary{cursor:pointer;color:var(--muted);font-weight:600}
.page-toc ul{columns:2;column-gap:26px;margin:.6em 0 0;padding-left:1.3em}
.page-toc li{break-inside:avoid}
.chapter-nav{display:flex;justify-content:space-between;gap:14px;margin:3em 0 1em;
  padding-top:18px;border-top:1px solid var(--border);font-size:13.5px}
.chapter-nav a{max-width:46%}

/* ---------- 搜索结果 ---------- */
#results{display:none;padding:26px 40px 120px;max-width:1080px;width:100%;margin:0 auto}
#results.on{display:block}
#results h2{margin-top:.2em}
.hit{padding:12px 14px;border:1px solid var(--border);border-radius:9px;background:var(--panel);margin:10px 0;cursor:pointer}
.hit:hover{border-color:var(--accent)}
.hit .t{font-weight:600;font-size:14.5px}
.hit .p{font-size:12.5px;color:var(--muted);margin-top:3px}
.hit .s{font-size:13.5px;margin-top:6px;word-break:break-word}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px}

/* ---------- 代码高亮主题（构建时内联） ---------- */
.chapter .hljs-doctag,.chapter .hljs-keyword,.chapter .hljs-meta .hljs-keyword,.chapter .hljs-template-tag,.chapter .hljs-template-variable,.chapter .hljs-type,.chapter .hljs-variable.language_{color:#d73a49}
.chapter .hljs-title,.chapter .hljs-title.class_,.chapter .hljs-title.class_.inherited__,.chapter .hljs-title.function_{color:#6f42c1}
.chapter .hljs-attr,.chapter .hljs-attribute,.chapter .hljs-literal,.chapter .hljs-meta,.chapter .hljs-number,.chapter .hljs-operator,.chapter .hljs-selector-attr,.chapter .hljs-selector-class,.chapter .hljs-selector-id,.chapter .hljs-variable{color:#005cc5}
.chapter .hljs-meta .hljs-string,.chapter .hljs-regexp,.chapter .hljs-string{color:#032f62}
.chapter .hljs-built_in,.chapter .hljs-symbol{color:#e36209}
.chapter .hljs-code,.chapter .hljs-comment,.chapter .hljs-formula{color:#6a737d}
.chapter .hljs-name,.chapter .hljs-quote,.chapter .hljs-selector-pseudo,.chapter .hljs-selector-tag{color:#22863a}
.chapter .hljs-subst{color:#24292e}
.chapter .hljs-section{color:#005cc5;font-weight:700}
.chapter .hljs-bullet{color:#735c0f}
.chapter .hljs-emphasis{color:#24292e;font-style:italic}
.chapter .hljs-strong{color:#24292e;font-weight:700}
.chapter .hljs-addition{color:#22863a;background-color:#f0fff4}
.chapter .hljs-deletion{color:#b31d28;background-color:#ffeef0}
html[data-theme="dark"] .chapter .hljs-doctag,html[data-theme="dark"] .chapter .hljs-keyword,html[data-theme="dark"] .chapter .hljs-meta .hljs-keyword,html[data-theme="dark"] .chapter .hljs-template-tag,html[data-theme="dark"] .chapter .hljs-template-variable,html[data-theme="dark"] .chapter .hljs-type,html[data-theme="dark"] .chapter .hljs-variable.language_{color:#ff7b72}
html[data-theme="dark"] .chapter .hljs-title,html[data-theme="dark"] .chapter .hljs-title.class_,html[data-theme="dark"] .chapter .hljs-title.class_.inherited__,html[data-theme="dark"] .chapter .hljs-title.function_{color:#d2a8ff}
html[data-theme="dark"] .chapter .hljs-attr,html[data-theme="dark"] .chapter .hljs-attribute,html[data-theme="dark"] .chapter .hljs-literal,html[data-theme="dark"] .chapter .hljs-meta,html[data-theme="dark"] .chapter .hljs-number,html[data-theme="dark"] .chapter .hljs-operator,html[data-theme="dark"] .chapter .hljs-selector-attr,html[data-theme="dark"] .chapter .hljs-selector-class,html[data-theme="dark"] .chapter .hljs-selector-id,html[data-theme="dark"] .chapter .hljs-variable{color:#79c0ff}
html[data-theme="dark"] .chapter .hljs-meta .hljs-string,html[data-theme="dark"] .chapter .hljs-regexp,html[data-theme="dark"] .chapter .hljs-string{color:#a5d6ff}
html[data-theme="dark"] .chapter .hljs-built_in,html[data-theme="dark"] .chapter .hljs-symbol{color:#ffa657}
html[data-theme="dark"] .chapter .hljs-code,html[data-theme="dark"] .chapter .hljs-comment,html[data-theme="dark"] .chapter .hljs-formula{color:#8b949e}
html[data-theme="dark"] .chapter .hljs-name,html[data-theme="dark"] .chapter .hljs-quote,html[data-theme="dark"] .chapter .hljs-selector-pseudo,html[data-theme="dark"] .chapter .hljs-selector-tag{color:#7ee787}
html[data-theme="dark"] .chapter .hljs-subst{color:#c9d1d9}
html[data-theme="dark"] .chapter .hljs-section{color:#1f6feb;font-weight:700}
html[data-theme="dark"] .chapter .hljs-bullet{color:#f2cc60}
html[data-theme="dark"] .chapter .hljs-emphasis{color:#c9d1d9;font-style:italic}
html[data-theme="dark"] .chapter .hljs-strong{color:#c9d1d9;font-weight:700}
html[data-theme="dark"] .chapter .hljs-addition{color:#aff5b4;background-color:#033a16}
html[data-theme="dark"] .chapter .hljs-deletion{color:#ffdcd7;background-color:#67060c}
.empty{color:var(--muted);padding:20px 0}

/* ---------- 响应式 ---------- */
@media (max-width:900px){
  :root{--sidebar-w:280px}
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  #menuBtn{display:inline-block}
  .content,#results{padding:18px 16px 100px}
  .page-toc ul{columns:1}
  .chapter h1{font-size:22px}
  .chapter h2{font-size:18px}
}

/* ---------- 打印 ---------- */
@media print{
  .sidebar,.topbar,#progress,.chapter-nav,.zoom,#results{display:none!important}
  .chapter{display:none!important}
  .chapter.active{display:block!important}
  .content{max-width:none;padding:0}
  .diagram{page-break-inside:avoid;border-color:#ccc}
  .page-toc{display:none}
  .code-block pre{max-height:none;overflow:visible;white-space:pre-wrap}
}
</style>
</head>
<body>
<div id="progress"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>Java 高级 / 架构师<br>面试复习知识库</h1>
      <div class="stat">32 章 · 48,048 行 · 365 张原理图</div>
    </div>
    <div class="searchbox">
      <input id="search" type="search" placeholder="搜索章节 / 全文检索…" autocomplete="off">
      <div class="hint">回车全文检索 · Esc 清除 · 按 / 聚焦</div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="btn" id="menuBtn">目录</button>
      <div class="crumb" id="crumb"></div>
      <button class="btn" id="prevTop">上一章</button>
      <button class="btn" id="nextTop">下一章</button>
      <button class="btn" id="printBtn">打印/导出 PDF</button>
      <button class="btn" id="themeBtn">深色</button>
    </div>
    <div class="content" id="content"></div>
    <div id="results"></div>
  </div>
</div>
<div class="zoom" id="zoom"><div class="inner" id="zoomInner"></div></div>

<script src="assets/mermaid.min.js"></script>
<script>
